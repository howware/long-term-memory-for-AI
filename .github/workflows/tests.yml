name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Time zone database (Windows has none built in)
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Skill installs and runs
        shell: bash
        run: |
          python tools/install_skill.py --target "$RUNNER_TEMP/skill"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          python "$RUNNER_TEMP/skill/scripts/memory.py" init --owner-name "CI" --owner-key person:ci
          python "$RUNNER_TEMP/skill/scripts/memory.py" brief --format text
          python "$RUNNER_TEMP/skill/scripts/memory.py" backup
